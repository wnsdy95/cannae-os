name: Release Integrity

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: release-integrity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-attestation:
    name: Verify published release attestation
    if: >-
      github.event_name == 'release' &&
      github.workflow_ref == format('{0}/.github/workflows/release-integrity.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_TAG: ${{ github.event.release.tag_name }}
      OBSERVATION_DIR: .cannae/release-integrity/${{ github.run_id }}-${{ github.run_attempt }}
      TRIGGER_ACTOR: ${{ github.actor }}
      TRIGGER_REF: ${{ github.ref }}
      TRIGGER_RUN_ID: ${{ github.run_id }}
      TRIGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout monitored default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.3"

      - name: Bind checkout to default branch identity
        run: git checkout -B main HEAD

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact release event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node github-release-integrity-monitor.js monitor \
            --repository-root . \
            --policy .github/release-integrity-policy.json \
            --trusted-root-output "${OBSERVATION_DIR}/github-trusted-root.json" \
            --trust-checkpoint-output "${OBSERVATION_DIR}/github-release-trust-checkpoint.json" \
            --output "${OBSERVATION_DIR}/release-attestation.json" \
            --scope release_attestation \
            --expected-tag "${EXPECTED_TAG}" \
            --trigger release \
            --actor "${TRIGGER_ACTOR}" \
            --run-id "${TRIGGER_RUN_ID}" \
            --run-attempt "${TRIGGER_RUN_ATTEMPT}" \
            --ref "${TRIGGER_REF}"

      - name: Retain release-attestation observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cannae/release-integrity/${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  full-monitor:
    name: Monitor immutable policy and all releases
    if: >-
      github.event_name != 'release' &&
      github.workflow_ref == format('{0}/.github/workflows/release-integrity.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OBSERVATION_DIR: .cannae/release-integrity/${{ github.run_id }}-${{ github.run_attempt }}
      TRIGGER_ACTOR: ${{ github.actor }}
      TRIGGER_KIND: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
      TRIGGER_REF: ${{ github.ref }}
      TRIGGER_RUN_ID: ${{ github.run_id }}
      TRIGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout monitored default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.3"

      - name: Bind checkout to default branch identity
        run: git checkout -B main HEAD

      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts

      - name: Inspect policy and release integrity
        env:
          CANNAE_IMMUTABILITY_MONITOR_TOKEN: ${{ secrets.CANNAE_IMMUTABILITY_MONITOR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node github-release-integrity-monitor.js monitor \
            --repository-root . \
            --policy .github/release-integrity-policy.json \
            --trusted-root-output "${OBSERVATION_DIR}/github-trusted-root.json" \
            --trust-checkpoint-output "${OBSERVATION_DIR}/github-release-trust-checkpoint.json" \
            --output "${OBSERVATION_DIR}/full-observation.json" \
            --scope full \
            --trigger "${TRIGGER_KIND}" \
            --actor "${TRIGGER_ACTOR}" \
            --run-id "${TRIGGER_RUN_ID}" \
            --run-attempt "${TRIGGER_RUN_ATTEMPT}" \
            --ref "${TRIGGER_REF}"

      - name: Retain full integrity observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cannae/release-integrity/${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
